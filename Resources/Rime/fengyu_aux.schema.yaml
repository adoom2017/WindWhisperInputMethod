# Rime schema
# encoding: utf-8

schema:
  schema_id: fengyu_aux
  name: 风语辅码索引
  version: "1.0.0"
  author:
    - 风语项目
  description: |
    内部辅码索引：全拼后附加仓颉首码。
    该依赖方案不显示在方案菜单中。

engine:
  processors:
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - abc_segmentor
    - fallback_segmentor
  translators:
    - table_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba

translator:
  dictionary: fengyu_aux
  enable_user_dict: false
  enable_completion: true
