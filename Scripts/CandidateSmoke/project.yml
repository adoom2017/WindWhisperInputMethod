name: CandidateSmoke
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YH6JCRN97J
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: CANDIDATE_UI_TEST
targets:
  CandidateSmoke:
    type: application
    platform: iOS
    sources:
      - path: ../../iOS/Keyboard/KeyboardViewController.swift
      - path: ../../iOS/Keyboard/FengYuSchema.swift
      - path: ../../iOS/Shared/KeyboardSharedStorage.swift
      - path: ../../Core/SwiftAdapter
      - path: ../ios-candidate-ui-smoke.swift
      - path: ../../iOS/Resources/fy.dict.yaml
        buildPhase: resources
      - path: ../../LICENSES/pinyin-data-MIT.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.windwhisper.candidate-smoke
        INFOPLIST_FILE: ../ios-candidate-ui-Info.plist
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
  KeyboardTouchTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../KeyboardTouchTests
    dependencies:
      - target: CandidateSmoke
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.windwhisper.keyboard-touch-tests
schemes:
  CandidateSmoke:
    build:
      targets:
        CandidateSmoke: all
    test:
      targets:
        - KeyboardTouchTests
