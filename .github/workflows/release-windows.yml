name: Build Windows Installer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test x64 setup EXE
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX
        run: |
          dotnet tool install wix --version 6.0.2 --tool-path build/tools/wix
          if ($LASTEXITCODE -ne 0) { throw 'WiX installation failed' }

      - name: Configure x64 build
        run: cmake -S . -B build/windows -G 'Visual Studio 17 2022' -A x64

      - name: Build NSIS installer
        run: ./Installer/Windows/build-installer.ps1 -Configuration Release

      - name: Run regression tests
        run: ctest --test-dir build/windows -C Release --output-on-failure

      - name: Test install, repair, and uninstall
        run: ./Installer/Windows/Test-Installer.ps1 -AllowMachineChanges

      - name: Verify installer and generate checksum
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $path = (Resolve-Path 'build/windows/Installer/Release/WindWhisperInputMethod-x64-Setup.exe').Path
          $version = [Diagnostics.FileVersionInfo]::GetVersionInfo($path).ProductVersion
          if (-not $version) { throw 'Installer ProductVersion is missing' }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$version") {
            throw "Release tag must match installer version v$version. Update Product.wxs before tagging."
          }
          $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WindWhisperInputMethod-x64-Setup.exe" | Set-Content -LiteralPath "$path.sha256" -Encoding utf8NoBOM
          "Windows x64 NSIS installer version: $version" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windwhisper-windows-x64-${{ github.run_number }}
          path: |
            build/windows/Installer/Release/WindWhisperInputMethod-x64-Setup.exe
            build/windows/Installer/Release/WindWhisperInputMethod-x64-Setup.exe.sha256
          if-no-files-found: error
          retention-days: 30

      # upload-artifact only takes files under the workspace.
      - name: Collect installer logs
        if: failure()
        run: |
          New-Item -ItemType Directory -Force -Path build/windows/installer-logs | Out-Null
          Copy-Item -Path 'C:/ProgramData/WindWhisper/Installer/*.log' `
            -Destination build/windows/installer-logs -ErrorAction SilentlyContinue

      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs-${{ github.run_number }}
          path: |
            build/windows/Testing/Temporary/
            build/windows/installer-logs/
          if-no-files-found: ignore

  publish:
    name: Attach setup EXE to release
    if: github.event_name == 'release'
    needs: build
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windwhisper-windows-x64-${{ github.run_number }}
          path: installer
      - name: Upload release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$env:RELEASE_TAG" installer/WindWhisperInputMethod-x64-Setup.exe installer/WindWhisperInputMethod-x64-Setup.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
