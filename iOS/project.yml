name: WindWhisperiOS
options:
  bundleIdPrefix: com.shendongchun.inputmethod.windwhisper
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: YH6JCRN97J
    CODE_SIGN_STYLE: Automatic
schemes:
  WindWhisper:
    build:
      targets:
        WindWhisper: all
    run:
      config: Debug
    archive:
      config: Release
targets:
  WindWhisper:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.inputmethod.windwhisper.ios
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/WindWhisper.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: WindWhisperKeyboard
        embed: true
  WindWhisperKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: Keyboard
      - path: Keyboard/FengYuSchema.swift
      - path: ../Core/SwiftAdapter/InputModels.swift
      - path: ../Core/SwiftAdapter/InputService.swift
      - path: ../Core/SwiftAdapter/InputEnginePlatform.swift
      - path: ../Resources/fy.dict.yaml
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shendongchun.inputmethod.windwhisper.ios.keyboard
        INFOPLIST_FILE: Keyboard/Info.plist
        CODE_SIGN_ENTITLEMENTS: Keyboard/WindWhisperKeyboard.entitlements
        SKIP_INSTALL: YES
